<!DOCTYPE html>
<meta charset="utf-8" />
<title>Mermaid to Excalidraw banner</title>
<style>
  @font-face {
    font-family: "Geist";
    src: url("geist-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
  }
  @font-face {
    font-family: "Geist Mono";
    src: url("geist-mono-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
  }
  @font-face {
    font-family: "Excalifont";
    src: url("Excalifont.woff2") format("woff2");
  }

  :root {
    --bg: #fbfbfd;
    --dots: #dcdce6;
    --fg: #17171c;
    --muted: #6b6b7b;
    --card: #ffffff;
    --border: #e6e6ee;
    --primary: #6965db;
    --primary-soft: #ecebfd;
    --glow: rgba(105, 101, 219, 0.26);
    --glow-2: rgba(32, 201, 151, 0.1);
    --shadow: 0 1px 2px rgba(20, 20, 40, 0.06),
      0 18px 48px -12px rgba(40, 36, 120, 0.28);
  }
  .dark {
    --bg: #0e0e12;
    --dots: #24242c;
    --fg: #f4f4f7;
    --muted: #a1a1b0;
    --card: #18181d;
    --border: rgba(255, 255, 255, 0.09);
    --primary: #9b97f5;
    --primary-soft: rgba(155, 151, 245, 0.14);
    --glow: rgba(105, 101, 219, 0.38);
    --glow-2: rgba(32, 201, 151, 0.12);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 24px 60px -12px rgba(0, 0, 0, 0.7);
  }

  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
  }
  body {
    font-family: "Geist", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .hero {
    position: relative;
    width: 1280px;
    height: 600px;
    overflow: hidden;
    border-radius: 18px;
    color: var(--fg);
    background: radial-gradient(
        560px 460px at 76% 52%,
        var(--glow),
        transparent 72%
      ),
      radial-gradient(480px 320px at 4% 100%, var(--glow-2), transparent 70%),
      radial-gradient(circle, var(--dots) 1.2px, transparent 1.4px) 0 0 / 22px
        22px,
      var(--bg);
  }

  .left {
    position: absolute;
    left: 72px;
    top: 0;
    bottom: 0;
    width: 520px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .logo {
    width: 54px;
    height: 54px;
    flex: none;
    margin-right: 16px;
    transform: translateY(2px);
  }
  h1 {
    margin: 0;
    font-size: 58px;
    line-height: 1;
    font-weight: 650;
    letter-spacing: -0.04em;
    white-space: nowrap;
  }
  h1 .row {
    display: flex;
    align-items: center;
  }
  h1 .row + .row {
    margin-top: 14px;
    padding-left: 70px;
  }
  .hand {
    position: relative;
    display: inline-block;
    font-family: "Excalifont";
    font-weight: 400;
    color: var(--primary);
    letter-spacing: 0;
    font-size: 66px;
  }
  .hand svg {
    position: absolute;
    left: -6px;
    bottom: -14px;
    width: calc(100% + 12px);
    height: 18px;
    overflow: visible;
  }
  .sub {
    margin: 34px 0 0;
    font-size: 22px;
    line-height: 1.4;
    color: var(--muted);
    letter-spacing: -0.01em;
  }

  .arrow {
    position: absolute;
    inset: 0;
    width: 1280px;
    height: 600px;
    color: var(--primary);
    pointer-events: none;
  }

  .code {
    position: absolute;
    left: 578px;
    top: 70px;
    width: 540px;
    border-radius: 14px;
    overflow: hidden;
    background: #15151b;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 30px 70px -18px rgba(10, 8, 40, 0.55);
    font-family: "Geist Mono", monospace;
    font-size: 13.5px;
    line-height: 1.6;
    color: #e6e6ef;
  }
  .bar {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 10px 14px;
    background: #1c1c24;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  .bar i {
    width: 11px;
    height: 11px;
    border-radius: 50%;
  }
  .bar span {
    margin-left: 10px;
    font-size: 12px;
    color: #8b8b9c;
    font-family: "Geist", sans-serif;
  }
  pre {
    margin: 0;
    padding: 14px 18px 16px;
    font: inherit;
    white-space: pre;
  }
  .k {
    color: #b7b4fa;
  }
  .s {
    color: #a6e3a1;
  }
  .n {
    color: #fab387;
  }
  .d {
    color: #6e6e80;
  }
  .o {
    color: #7dd3c0;
  }

  .canvas {
    position: absolute;
    right: 44px;
    top: 330px;
    width: 560px;
    padding: 12px;
    border-radius: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    transform: rotate(-2deg);
  }
  .canvas img {
    display: block;
    width: 100%;
    border-radius: 8px;
  }
</style>

            fill="#6965DB"
          /></svg
        ><span>Mermaid to</span></span
      >
      <span class="row"
        ><span class="hand"
          >Excalidraw<svg viewBox="0 0 200 18" preserveAspectRatio="none">

    </h1>
    <p class="sub">
      Turn Mermaid diagrams into shapes,<br />arrows and text you can keep

  </div>

  <div class="code">
    <div class="bar">
      <i style="background: #ff5f57"></i><i style="background: #febc2e"></i

    <pre id="source"></pre>

  <svg
    class="arrow"
    viewBox="0 0 1280 600"

    stroke-width="2.6"

    <path d="M1160 294 L 1169 316 L 1190 302" />
  </svg>

  <div class="canvas"><img id="diagram" alt="" /></div>
</div>

<script>
  const theme = new URLSearchParams(location.search).get("theme") || "light";
  document.documentElement.classList.toggle("dark", theme === "dark");
  document.getElementById("diagram").src = `flow-${theme}.png`;

  // Shows flow.mmd as is, with light syntax highlighting.
  const escape = (text) => text.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  fetch("flow.mmd")
    .then((res) => res.text())
    .then((text) => {
      document.getElementById("source").innerHTML = text
        .trimEnd()
        .split("\n")
        .map((line) =>
          escape(line)
            .replace(/"[^"]*"/g, (m) => `<span class="s">${m}</span>`)
            .replace(/\|([^|]*)\|/g, '<span class="o">|$1|</span>')
            .replace(/(-->)/g, '<span class="o">$1</span>')
            .replace(
              /^(\s*)(flowchart|classDef)\b/,
              '$1<span class="k">$2</span>'
            )
            .replace(/(:::\w+)/g, '<span class="n">$1</span>')
            .replace(/\b(LR|TD|TB)$/, '<span class="n">$1</span>')
        )
        .join("\n");
      document.getElementById("source").dataset.ready = "1";
    });
</script>
